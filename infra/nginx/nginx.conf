# KNGL Dublaj — kenar (edge) katmanı
# Görevler: TLS sonlandırma (Caddy/ALB arkasında ise düz HTTP), yük dengeleme, statik/medya servis,
# anonim HTML mikro-önbelleği, bağlantı ve istek hız sınırları, WebSocket yönlendirme.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
  multi_accept on;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  client_max_body_size 10m;          # tek take en fazla 8 MB
  client_body_buffer_size 1m;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=64k flush=5s;
  error_log  /var/log/nginx/error.log warn;

  # ---- Sıkıştırma ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

  # ---- Hız sınırları (IP başına) ----
  limit_req_zone  $binary_remote_addr zone=req_general:20m rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=req_api:20m     rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=req_auth:10m    rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
  limit_req_status 429;
  limit_conn_status 429;

  # ---- Mikro-önbellek: anonim ziyaretçiler için HTML ----
  proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html_cache:64m max_size=1g inactive=10m use_temp_path=off;
  # Oturum çerezi olan istekler önbelleği atlar (kişiselleştirilmiş içerik).
  map $http_cookie $skip_cache {
    default 0;
    "~*kngl_sid" 1;
    "~*kngl_guest" 1;
  }
  map $request_method $is_get {
    default 1;
    GET 0;
    HEAD 0;
  }

  # ---- WebSocket upgrade ----
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ---- Upstream'ler ----
  upstream web {
    least_conn;
    # docker-compose --scale web=N ile çoğaltılır; Docker DNS tüm replikaları döndürür.
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream realtime {
    # WebSocket için oturum yapışkanlığı (HTTP long-polling düşerse aynı düğüme gider).
    ip_hash;
    server realtime:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80 reuseport;
    server_name _;

    # Güvenlik başlıkları (uygulama da ekler; burası ikinci emniyet)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn conn_per_ip 100;

    # ---- Sağlık ----
    location = /healthz { access_log off; return 200 "ok\n"; }

    # ---- Next.js statik varlıklar: içerik adresli, sonsuza kadar önbellek ----
    location ^~ /_next/static/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache html_cache;
      proxy_cache_valid 200 30d;
      proxy_ignore_headers Cache-Control Expires;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache $upstream_cache_status;
    }

    # ---- Medya: sahne kaynakları ve final videolar (paylaşılan volume'dan doğrudan) ----
    location ^~ /media/ {
      alias /srv/media/;
      add_header Cache-Control "public, max-age=86400";
      add_header Accept-Ranges bytes;
      types { video/mp4 mp4; audio/webm webm; image/svg+xml svg; image/jpeg jpg; image/png png; }
      try_files $uri =404;
    }

    # ---- Socket.IO → realtime ----
    location /socket.io/ {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering off;
    }

    # ---- Kimlik uçları: sıkı limit ----
    location ~ ^/api/auth/ {
      limit_req zone=req_auth burst=5 nodelay;
      proxy_pass http://web;
      include /etc/nginx/proxy_common.conf;
    }

    # ---- API ----
    location /api/ {
      limit_req zone=req_api burst=20 nodelay;
      proxy_pass http://web;
      include /etc/nginx/proxy_common.conf;
      proxy_request_buffering off;   # take yüklemeleri akış halinde geçsin
    }

    # ---- Sayfalar: anonim HTML mikro-önbelleği ----
    location / {
      limit_req zone=req_general burst=60 nodelay;
      proxy_pass http://web;
      include /etc/nginx/proxy_common.conf;

      proxy_cache html_cache;
      proxy_cache_key "$scheme$host$request_uri";
      proxy_cache_valid 200 301 302 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;              # aynı sayfa için tek upstream isteği (stampede koruması)
      proxy_cache_lock_timeout 3s;
      proxy_cache_bypass $skip_cache $is_get;
      proxy_no_cache $skip_cache $is_get;
      proxy_ignore_headers Set-Cookie;  # önbellekten çerez sızmasın
      proxy_hide_header Set-Cookie;
      add_header X-Cache $upstream_cache_status;
    }
  }
}
