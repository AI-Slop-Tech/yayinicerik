# KNGL Dublaj — Coolify için compose dosyası
# Coolify > New Resource > Docker Compose > "Docker Compose Location" alanına: /docker-compose.coolify.yml
#
# Farkları (docker-compose.yml'e göre):
#  - Host port bağlamaz: Coolify'ın kendi proxy'si (Traefik/Caddy) nginx'in 80 portuna yönlendirir.
#  - Gizli değerler Coolify'ın "magic" değişkenleriyle otomatik üretilir (SERVICE_PASSWORD_*, SERVICE_FQDN_*).
#  - Replika/limit ayarı yok; Coolify tek kopya çalıştırır. Ölçekleme için docker-compose.yml + Swarm ya da ayrı sunucu.
#
# Alan adını Coolify'da nginx servisine tanımlayın; SERVICE_URL_NGINX buna göre dolar.

services:
  nginx:
    build: ./infra/nginx
    environment:
      - SERVICE_FQDN_NGINX_80
    expose:
      - "80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_NGINX}
      - NEXT_PUBLIC_REALTIME_URL=
      - UPLOAD_DIR=/data/uploads
      - MEDIA_BASE_URL=/media
      - PG_POOL_MAX=10
      - DISCORD_INVITE_URL=${DISCORD_INVITE_URL:-https://discord.gg/kngl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${SERVICE_URL_NGINX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/data/uploads
      - SCENE_MEDIA_DIR=/data/media/scenes
      - OUTPUT_DIR=/data/media/dubs
      - MEDIA_BASE_URL=/media
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-2}
      - WATERMARK_TEXT=KNGL Dublaj
    volumes:
      - uploads:/data/uploads
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: build
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs"
    environment:
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kngl
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=kngl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kngl -d kngl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  media:
