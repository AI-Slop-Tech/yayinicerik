# KNGL Dublaj — üretim topolojisi (Coolify ile birebir uyumlu; düz `docker compose` ile de çalışır)
#   nginx (kenar) → web (Next.js) → postgres / redis
#                 → realtime (Socket.IO, Redis adapter)
#   worker (BullMQ + ffmpeg) ← redis kuyruğu
# Şema migrasyonu ve ilk seed web konteynerinin açılışında çalışır (apps/web/docker-entrypoint.sh).
#
# Coolify: New Resource → Docker Compose, dosya yolu /docker-compose.yml, alan adını yalnızca nginx servisine verin.
#   SERVICE_PASSWORD_64_SESSION, SERVICE_PASSWORD_POSTGRES ve SERVICE_URL_NGINX değerlerini Coolify kendisi üretir.
# Coolify dışı: aynı üç değişkeni .env dosyasına yazın (bkz. .env.example); proxy'siz sunucuda
#   docker-compose.override.example.yml ile 80 portunu açın.
#
# Bilinçli olarak yok: `deploy.replicas`, `container_name`, `ports`. Coolify konteyner adlarını kendisi verir ve
# replika ile çakışır; portu önündeki proxy yönetir. Yatay ölçekleme için Swarm/Kubernetes ya da ayrı sunucular.

services:
  nginx:
    build: ./infra/nginx
    environment:
      - SERVICE_FQDN_NGINX_80
    # Doğrudan erişim: proxy yapılandırmasına bağlı kalmadan site http://SUNUCU_IP:8080 adresinden açılır.
    # Coolify/Traefik alan adını yönlendirdiğinde de aynı konteyner kullanılır; iki yol birlikte çalışır.
    # Portu değiştirmek için ortam değişkeni: HTTP_PORT=9090
    ports:
      - "${HTTP_PORT:-8080}:80"
    # Coolify'ın proxy'si (Traefik) için yönlendirme: alan adı PUBLIC_HOST'tan, o yoksa Coolify'ın
    # kendi COOLIFY_FQDN değerinden alınır. Böylece arayüzde ayrıca "Domains" ayarı gerekmez.
    # Kendi alan adınız için Coolify → Environment Variables → PUBLIC_HOST=kngldublaj.com yeterlidir.
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.kngl-nginx.loadbalancer.server.port=80
      - traefik.http.routers.kngl-http.rule=Host(`${PUBLIC_HOST:-${COOLIFY_FQDN:-localhost}}`)
      - traefik.http.routers.kngl-http.entryPoints=http
      - traefik.http.routers.kngl-http.service=kngl-nginx
      - traefik.http.routers.kngl-https.rule=Host(`${PUBLIC_HOST:-${COOLIFY_FQDN:-localhost}}`)
      - traefik.http.routers.kngl-https.entryPoints=https
      - traefik.http.routers.kngl-https.tls=true
      - traefik.http.routers.kngl-https.tls.certresolver=letsencrypt
      - traefik.http.routers.kngl-https.service=kngl-nginx
    networks:
      - default
      - coolify
    volumes:
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_NGINX}
      - NEXT_PUBLIC_REALTIME_URL=
      - UPLOAD_DIR=/data/uploads
      - MEDIA_DIR=/data/media
      - MEDIA_BASE_URL=/media
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - PG_POOL_MAX=${PG_POOL_MAX:-10}
      - DISCORD_INVITE_URL=${DISCORD_INVITE_URL:-https://discord.gg/kngl}
    volumes:
      - uploads:/data/uploads
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${SERVICE_URL_NGINX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://kngl:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kngl
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/data/uploads
      - SCENE_MEDIA_DIR=/data/media/scenes
      - OUTPUT_DIR=/data/media/dubs
      - MEDIA_BASE_URL=/media
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-2}
      - WATERMARK_TEXT=${WATERMARK_TEXT:-KNGL Dublaj}
    volumes:
      - uploads:/data/uploads
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kngl
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=kngl
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB
               -c work_mem=8MB -c maintenance_work_mem=64MB -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kngl -d kngl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  media:

networks:
  # Coolify sunucularında hazır bulunan proxy ağı. Coolify dışı kurulumda bir kez oluşturun:
  #   docker network create coolify
  coolify:
    external: true
