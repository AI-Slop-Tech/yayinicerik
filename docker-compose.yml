# KNGL Dublaj — üretim topolojisi
#   nginx (kenar) → web ×N (Next.js, durumsuz) → postgres / redis
#                 → realtime ×M (Socket.IO, Redis adapter)
#   worker ×K (BullMQ + ffmpeg)  ← redis kuyruğu
# Ölçekleme: docker compose up -d --scale web=4 --scale realtime=2 --scale worker=3
name: kngl-dublaj

x-common-env: &common-env
  NODE_ENV: production
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET ayarlanmalı}
  DATABASE_URL: postgres://${POSTGRES_USER:-kngl}:${POSTGRES_PASSWORD:-kngl}@postgres:5432/${POSTGRES_DB:-kngl}
  REDIS_URL: redis://redis:6379

services:
  nginx:
    build: ./infra/nginx
    ports:
      - "${HTTP_PORT:-80}:80"   # Coolify/Traefik olan sunucuda HTTP_PORT=8080 gibi bir değer verin
    volumes:
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      <<: *common-env
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_REALTIME_URL: ""
      UPLOAD_DIR: /data/uploads
      MEDIA_BASE_URL: /media
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-https://discord.gg/kngl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits: { memory: 768M }
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    environment:
      <<: *common-env
      PORT: 4000
      CORS_ORIGINS: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M }
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *common-env
      UPLOAD_DIR: /data/uploads
      SCENE_MEDIA_DIR: /data/media/scenes
      OUTPUT_DIR: /data/media/dubs
      MEDIA_BASE_URL: /media
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      WATERMARK_TEXT: ${WATERMARK_TEXT:-KNGL Dublaj}
    volumes:
      - uploads:/data/uploads
      - media:/data/media
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1G }
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: build
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kngl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kngl}
      POSTGRES_DB: ${POSTGRES_DB:-kngl}
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB
               -c work_mem=8MB -c maintenance_work_mem=64MB -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kngl} -d ${POSTGRES_DB:-kngl}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Odalar ve önbellek geçici veridir; bellek dolarsa en az kullanılan önbellek anahtarları atılır.
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  media:
